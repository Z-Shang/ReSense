name: Build Android artifacts

on:
  push:
    branches:
      - main
      - 'feature/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-artifacts-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download and verify stock ROM
        env:
          SENSE_ROM_URL: ${{ secrets.SENSE_ROM_URL }}
        run: |
          if [[ -z "$SENSE_ROM_URL" ]]; then
            echo '::error::Set the SENSE_ROM_URL repository secret to a direct HTTPS URL for the stock 3.33.401.153 ROM ZIP. See docs/CI-ARTIFACTS.md.'
            exit 1
          fi
          mkdir -p res
          curl --fail --location --silent --show-error --retry 3 \
            --connect-timeout 30 --max-time 900 \
            --proto '=https' --proto-redir '=https' \
            --output res/3.33.401.153.zip "$SENSE_ROM_URL"
          sha256sum --check .github/rom.sha256

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK 35
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Prepare build directories and optional debug key
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          export ANDROID_USER_HOME="$RUNNER_TEMP/sense-android-user"
          export GRADLE_USER_HOME="$RUNNER_TEMP/sense-gradle-home"
          mkdir -p "$ANDROID_USER_HOME" "$GRADLE_USER_HOME"
          echo "ANDROID_USER_HOME=$ANDROID_USER_HOME" >> "$GITHUB_ENV"
          echo "GRADLE_USER_HOME=$GRADLE_USER_HOME" >> "$GITHUB_ENV"
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path
          encoded = os.environ.get('DEBUG_KEYSTORE_BASE64', '')
          if encoded:
              key = Path(os.environ['ANDROID_USER_HOME']) / 'debug.keystore'
              key.write_bytes(base64.b64decode(''.join(encoded.split()), validate=True))
              key.chmod(0o600)
          PY

      - name: Build APKs and framework AAR
        run: |
          mkdir -p build/ci-logs
          ./gradlew --no-daemon --stacktrace --console=plain --max-workers=2 \
            assembleSharedDebug :sense-framework:assembleDebug \
            2>&1 | tee build/ci-logs/build.log

      - name: Verify and collect artifacts
        run: |
          python3 -m unittest discover -s tools -p test_ci_artifacts.py -v
          python3 tools/test_shared_framework.py
          python3 tools/collect_ci_artifacts.py

      - name: Upload shared-framework APK set
        uses: actions/upload-artifact@v7
        with:
          name: sense-shared-debug-${{ github.sha }}
          path: build/ci-artifacts/shared-debug/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload standalone APKs
        uses: actions/upload-artifact@v7
        with:
          name: sense-standalone-debug-${{ github.sha }}
          path: build/ci-artifacts/standalone-debug/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload framework AAR
        uses: actions/upload-artifact@v7
        with:
          name: sense-framework-debug-aar-${{ github.sha }}
          path: build/ci-artifacts/framework-debug/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload build log
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: sense-build-log-${{ github.sha }}
          path: build/ci-logs/build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Summarize downloads
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          Built debug artifacts are available in this run's **Artifacts** section:

          - **sense-shared-debug**: install-once framework, services and six dependent apps.
          - **sense-standalone-debug**: six self-contained apps and the weather-sharing services APK.
          - **sense-framework-debug-aar**: reusable Android library.

          Each download includes SHA256SUMS and installation notes. These are debug builds.
          SUMMARY
